<div class="tool-page"><div class="container">
<div class="breadcrumb"><a href="/">홈</a><span>›</span>원단 잔량 계산기</div>
<div class="tool-header"><div class="tool-icon" style="font-size:2.2rem">🎞️</div><div><h1>원단 잔량 계산기</h1><p>노란 칸만 입력하면 필름 길이가 바로 계산됩니다</p></div></div>

<div class="panel">
  <h3>입력값</h3>
  <div class="calc-form roll-grid">
    <div class="form-group"><label for="a">필름 반지름(a) <small>mm</small></label><input type="number" inputmode="decimal" id="a" value="5" step="any" min="0"></div>
    <div class="form-group"><label for="th">필름 두께 <small>µm</small></label><input type="number" inputmode="decimal" id="th" value="38" step="any" min="0"></div>
    <div class="form-group"><label for="b">지관 크기(b) <small>인치</small></label><input type="number" inputmode="decimal" id="b" value="3" step="any" min="0"></div>
    <div class="form-group"><label for="w">지관 두께(t) <small>mm</small></label><input type="number" inputmode="decimal" id="w" value="7" step="any" min="0"></div>
  </div>
</div>

<div class="panel roll-result">
  <h3>계산값</h3>
  <div class="result-box" id="result">
    <div class="result-main" id="resLen">—</div>
    <div class="result-label">필름 길이</div>
    <div class="result-rows">
      <div class="result-row"><span class="label">직경 D</span><span class="value" id="resD">—</span></div>
      <div class="result-row"><span class="label">직경 d</span><span class="value" id="resd">—</span></div>
    </div>
  </div>
</div>

<div class="wooa-orig-anchor"></div>
</div></div>
<aside class="tool-sidebar"></aside>
</div>
<footer class="footer"></footer>

<script>
(function(){
  function val(id){ var x = parseFloat(document.getElementById(id).value); return isNaN(x) ? null : x; }
  function fmt(x, max){ return x.toLocaleString('ko-KR', {maximumFractionDigits: max}); }
  function calc(){
    var a = val('a'), th = val('th'), b = val('b'), w = val('w');
    if (a === null || th === null || b === null || w === null || a < 0 || b < 0 || w < 0 || th <= 0) {
      ['resLen','resD','resd'].forEach(function(i){ document.getElementById(i).textContent = '—'; });
      return;
    }
    var d = b * 25.4 + w * 2;                       // 직경 d (mm)
    var D = a * 2 + d;                              // 직경 D (mm)
    var len = (D * D - d * d) * Math.PI / 4 / th;   // 필름 길이 (m)
    document.getElementById('resLen').textContent = fmt(len, 2) + ' m';
    document.getElementById('resD').textContent = fmt(D, 2) + ' mm';
    document.getElementById('resd').textContent = fmt(d, 2) + ' mm';
  }
  ['a','th','b','w'].forEach(function(id){ document.getElementById(id).addEventListener('input', calc); });
  calc();
})();
</script>

<script src="js/wooahouse-originals-tool.js"></script>

<script src="js/wooa-footer.js"></script>
